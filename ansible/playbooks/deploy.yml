---
- hosts: webserver
  gather_facts: no

  tasks:
    - name: Update apt cache
      raw: sudo apt-get update -y

    - name: Install Java 8
      raw: sudo apt-get install -y openjdk-8-jdk

    - name: Create deploy directory
      raw: sudo mkdir -p /opt/app

    - name: Stop existing app if running
      raw: sudo pkill -f devops-demo-0.3.0.jar || true

    - name: Move jar into place
      raw: sudo mv /tmp/devops-demo-0.3.0.jar /opt/app/devops-demo-0.3.0.jar

    - name: Start application
      raw: sudo bash -c 'nohup java --add-opens java.base/java.lang=ALL-UNNAMED -jar /opt/app/devops-demo-0.3.0.jar > /opt/app/app.log 2>&1 & disown'
